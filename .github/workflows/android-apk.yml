name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets for the Android WebView
        run: npm run build

      - name: Generate and sync native Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/apply-android-icon.mjs

      - name: Compile installable Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk PixelPaintMilitary.apk
          test -s PixelPaintMilitary.apk

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-build-${GITHUB_RUN_NUMBER}" PixelPaintMilitary.apk \
            --target "$GITHUB_SHA" \
            --title "Pixel Paint Military - Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Installable Android test APK (debug-signed)." \
            --latest 2>/dev/null || \
          gh release upload "apk-build-${GITHUB_RUN_NUMBER}" PixelPaintMilitary.apk \
            --clobber

      - name: Show direct download URL
        run: echo "Download https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/PixelPaintMilitary.apk"
